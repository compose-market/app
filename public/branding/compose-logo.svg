<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="logo-glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-glow-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-glow-extreme" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="logo-leftTubeGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="logo-topTubeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f0abfc" />
    </linearGradient>

    <linearGradient id="logo-rightTubeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="logo-bottomTubeGlow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="logo-nodeTLGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#083344" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="logo-nodeTRGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#831843" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#831843" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="logo-nodeBRGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#1e1b4b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="logo-nodeBLGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#064e3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="logo-glassHorizSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="logo-glassVertSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect x="33" y="20.5" width="34" height="9" fill="url(#logo-glassHorizSheen)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />
  <rect x="33" y="70.5" width="34" height="9" fill="url(#logo-glassHorizSheen)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />
  <rect x="20.5" y="33" width="9" height="34" fill="url(#logo-glassVertSheen)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />
  <rect x="70.5" y="33" width="9" height="34" fill="url(#logo-glassVertSheen)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />

  <path d="M 25 75 C 20.5 62, 29.5 48, 24.5 35 C 22.5 29, 25 25, 25 25" fill="none" stroke="url(#logo-leftTubeGlow)" stroke-width="5" filter="url(#logo-glow-extreme)" opacity="0.85" />
  <line x1="25" y1="25" x2="75" y2="25" stroke="url(#logo-topTubeGlow)" stroke-width="2" stroke-dasharray="4 3" filter="url(#logo-glow-medium)" opacity="0.75" />
  <path d="M 66 25 C 74 24, 76 24, 76 29 C 74 36, 77 46, 75 60 C 73.5 70, 75 75, 75 75" fill="none" stroke="url(#logo-rightTubeGlow)" stroke-width="5.5" filter="url(#logo-glow-extreme)" opacity="0.9" />
  <path d="M 75 75 C 62 78.5, 48 71.5, 36 76.5 C 29.5 78.5, 25 75, 25 75" fill="none" stroke="url(#logo-bottomTubeGlow)" stroke-width="5" filter="url(#logo-glow-extreme)" opacity="0.85" />

  <circle cx="25" cy="25" r="7.5" fill="url(#logo-nodeTLGrad)" filter="url(#logo-glow-heavy)" />
  <circle cx="75" cy="25" r="8" fill="url(#logo-nodeTRGrad)" filter="url(#logo-glow-heavy)" />
  <circle cx="75" cy="75" r="7.5" fill="url(#logo-nodeBRGrad)" filter="url(#logo-glow-heavy)" />
  <circle cx="25" cy="75" r="7.5" fill="url(#logo-nodeBLGrad)" filter="url(#logo-glow-heavy)" />

  <path d="M 25 75 C 20.5 62, 29.5 48, 24.5 35 C 22.5 29, 25 25, 25 25" fill="none" stroke="url(#logo-leftTubeGlow)" stroke-width="2" filter="url(#logo-glow-medium)" />
  <path d="M 25 75 C 20.5 62, 29.5 48, 24.5 35 C 22.5 29, 25 25, 25 25" fill="none" stroke="#f0fdf4" stroke-width="1" />

  <path d="M 66 25 C 74 24, 76 24, 76 29 C 74 36, 77 46, 75 60 C 73.5 70, 75 75, 75 75" fill="none" stroke="url(#logo-rightTubeGlow)" stroke-width="2" filter="url(#logo-glow-medium)" />
  <path d="M 66 25 C 74 24, 76 24, 76 29 C 74 36, 77 46, 75 60 C 73.5 70, 75 75, 75 75" fill="none" stroke="#fdf4ff" stroke-width="1" />

  <path d="M 75 75 C 62 78.5, 48 71.5, 36 76.5 C 29.5 78.5, 25 75, 25 75" fill="none" stroke="url(#logo-bottomTubeGlow)" stroke-width="2" filter="url(#logo-glow-medium)" />
  <path d="M 75 75 C 62 78.5, 48 71.5, 36 76.5 C 29.5 78.5, 25 75, 25 75" fill="none" stroke="#eff6ff" stroke-width="1" />

  <circle cx="22" cy="65" r="0.9" fill="#a7f3d0" filter="url(#logo-glow-soft)" />
  <circle cx="28" cy="56" r="1.1" fill="#67e8f9" filter="url(#logo-glow-soft)" />
  <circle cx="22" cy="40" r="0.8" fill="#ffffff" />
  <circle cx="27.5" cy="30" r="1" fill="#22d3ee" filter="url(#logo-glow-soft)" />
  <circle cx="73.5" cy="35" r="1" fill="#f472b6" filter="url(#logo-glow-soft)" />
  <circle cx="77.5" cy="64" r="0.9" fill="#a855f7" filter="url(#logo-glow-soft)" />
  <circle cx="43" cy="74.5" r="0.9" fill="#38bdf8" filter="url(#logo-glow-soft)" />
  <circle cx="58" cy="77" r="0.8" fill="#818cf8" filter="url(#logo-glow-soft)" />

  <circle cx="25" cy="25" r="12.5" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.9" />
  <circle cx="25" cy="25" r="10" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.6" />
  <ellipse cx="20.5" cy="20.5" rx="3.5" ry="1.8" transform="rotate(-40 20.5 20.5)" fill="#ffffff" opacity="0.8" />

  <circle cx="75" cy="25" r="12.5" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.9" />
  <circle cx="75" cy="25" r="10" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.6" />
  <ellipse cx="70.5" cy="20.5" rx="3.5" ry="1.8" transform="rotate(-40 70.5 20.5)" fill="#ffffff" opacity="0.8" />

  <circle cx="75" cy="75" r="12.5" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.9" />
  <circle cx="75" cy="75" r="10" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.6" />
  <ellipse cx="70.5" cy="70.5" rx="3.5" ry="1.8" transform="rotate(-40 70.5 70.5)" fill="#ffffff" opacity="0.8" />

  <circle cx="25" cy="75" r="12.5" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.9" />
  <circle cx="25" cy="75" r="10" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="0.6" />
  <ellipse cx="20.5" cy="70.5" rx="3.5" ry="1.8" transform="rotate(-40 20.5 70.5)" fill="#ffffff" opacity="0.8" />

  <line x1="33" y1="20.5" x2="67" y2="20.5" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="33" y1="70.5" x2="67" y2="70.5" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="20.5" y1="33" x2="20.5" y2="67" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="70.5" y1="33" x2="70.5" y2="67" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
</svg>